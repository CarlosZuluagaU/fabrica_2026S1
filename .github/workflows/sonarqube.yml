name: SonarQube

on:
  push:
    branches:
      - main
      - feature/test-coverage
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('MS_Finanzas/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests and generate coverage
        working-directory: ./MS_Finanzas
        run: mvn -B verify -Dsonar.skip=true

      - name: Analyze with SonarCloud
        working-directory: ./MS_Finanzas
        env:
          SONAR_TOKEN: ${{ secrets.Sonar }}
        run: mvn -B sonar:sonar -Dsonar.projectKey=CarlosZuluagaU_fabrica_2026S12 -Dsonar.organization=carloszuluagau -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
